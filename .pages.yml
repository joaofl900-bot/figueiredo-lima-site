# Configuração do editor Pages CMS (app.pagescms.org).
# Define o que pode ser editado pelo navegador, sem mexer em código.
# Cada "Salvar" grava no GitHub, e a Cloudflare publica o site sozinha em cerca de 2 minutos.

media:
  - name: imagens
    label: Imagens dos artigos
    input: public/img/artigos
    output: /img/artigos
    rename: safe
    extensions: [jpg, jpeg, png, webp]

content:
  - name: artigos
    label: Artigos
    type: collection
    path: src/content/artigos
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      primary: title
      fields: [title, area, date, draft]
      sort: date
      order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Resumo (aparece no Google e na lista de artigos; até 170 caracteres)
        type: text
        required: true
        pattern:
          regex: "^.{20,170}$"
          message: O resumo deve ter entre 20 e 170 caracteres.
      - name: area
        label: Área
        type: select
        required: true
        options:
          values:
            - { name: tributario, label: Tributário para empresas }
            - { name: planos-de-saude, label: Planos de saúde }
            - { name: consumidor, label: Direito do consumidor }
            - { name: leiloes-de-imoveis, label: Leilões de imóveis }
            - { name: direito-publico, label: Direito público }
            - { name: civel, label: Cível }
      - name: date
        label: Data de publicação
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Data da última revisão (opcional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Rascunho (marcado = não aparece no site)
        type: boolean
        default: true
      - name: body
        label: Texto
        type: rich-text
        options:
          format: markdown
          media: imagens
