destaque:
  id: assessoria
  sobretitulo: Assessoria mensal
  titulo: A situação fiscal da sua empresa acompanhada por advogado, todo mês
  paragrafos:
    - Depois da regularização, é preciso manter os acordos em dia, responder a novas cobranças e acompanhar novos editais de negociação e mudanças na lei. Com a assessoria mensal, esse acompanhamento é feito pelo mesmo advogado, nos limites definidos em contrato.
  nota: O escopo é definido em contrato. Impugnações, recursos e ações judiciais são contratados conforme a necessidade de cada caso. A assessoria é jurídica e não substitui a contabilidade.
  itens:
    - Acompanhamento das negociações, parcelamentos e transações em andamento
    - Controle dos prazos dos débitos e acordos acompanhados
    - Orientação sobre cartas, notificações e intimações recebidas
    - Aviso sobre novos editais de negociação e mudanças na legislação
    - Conversa com o contador da empresa, quando necessário
