faqTitulo: Dúvidas sobre débitos tributários
faq:
  - pergunta: O que significa ter um débito inscrito em dívida ativa?
    resposta: Quando um tributo federal não é pago no prazo, o débito pode ser encaminhado à Procuradoria-Geral da Fazenda Nacional (PGFN) e inscrito em dívida ativa da União. A partir daí, a cobrança pode incluir protesto, execução fiscal e dificuldade para obter certidões de regularidade.
  - pergunta: Qual é a diferença entre parcelamento e transação tributária?
    resposta: O parcelamento divide o débito em prestações, em regra sem redução de multas e juros; o parcelamento ordinário de débitos federais admite até 60 parcelas. A transação é um acordo previsto na Lei nº 13.988/2020, oferecido pela PGFN ou pela Receita Federal por edital ou proposta individual. Pode incluir descontos em multas, juros e encargos, nunca no valor principal, e prazos maiores, conforme a modalidade e a situação do contribuinte.
  - pergunta: Toda empresa consegue transação com desconto?
    resposta: Não. Os descontos dependem da modalidade disponível, da classificação do débito, da capacidade de pagamento da empresa e dos requisitos de cada edital. Só a análise do caso indica quais alternativas são cabíveis.
  - pergunta: Débitos impedem a empresa de ficar no Simples Nacional?
    resposta: Débitos com o INSS ou com as Fazendas Públicas cuja exigibilidade não esteja suspensa impedem o ingresso no Simples Nacional e podem levar à exclusão do regime (Lei Complementar nº 123/2006, art. 17, V). Para a empresa que já é optante, a lei permite a permanência no regime se ela comprovar a regularização em até 90 dias contados da ciência da comunicação de exclusão (art. 31, § 2º).
  - pergunta: Para que serve a assessoria mensal?
    resposta: Para acompanhar, depois da regularização e dentro do escopo contratado, parcelas e acordos, novas cobranças e notificações e as mudanças de regras que possam abrir outras alternativas. A assessoria não impede fiscalizações nem garante resultados; ela permite agir dentro dos prazos e com informação.
  - pergunta: O escritório substitui o contador?
    resposta: Não. A contabilidade continua responsável pela escrituração, pela apuração dos tributos e pelas declarações. A atuação do escritório é jurídica e, quando útil, feita em diálogo com o contador da empresa.
  - pergunta: O atendimento pode ser todo on-line?
    resposta: Sim, para empresas de qualquer lugar do Brasil, com conversa por WhatsApp ou vídeo, documentos em PDF e contrato com assinatura eletrônica. Em Brasília, também há atendimento presencial com horário marcado.
  - pergunta: Como confirmo a inscrição do advogado?
    resposta: No Cadastro Nacional dos Advogados (cna.oab.org.br), pelo nome João Vitor Figueiredo Lima ou pelo número OAB/DF 77.088.
