h1: Advogado de planos de saúde em Brasília
abertura: Se o plano negou um tratamento ou aumentou muito a mensalidade, você não precisa enfrentar isso sozinho. Explico o que a lei e o seu contrato dizem e quais caminhos existem, inclusive quando há urgência.
