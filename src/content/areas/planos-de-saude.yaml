faq:
  - pergunta: O plano pode negar atendimento de urgência ou emergência?
    resposta: A lei torna obrigatória a cobertura na emergência, quando há risco imediato de vida ou de lesão irreparável declarado pelo médico, e na urgência, decorrente de acidente pessoal ou de complicação na gestação (Lei nº 9.656/1998, art. 35-C). Cada contrato e cada caso precisam ser analisados.
  - pergunta: O reajuste por mudança de faixa etária é permitido?
    resposta: O STJ considera válido o reajuste previsto no contrato, que siga as regras da ANS e não use percentuais desarrazoados (Tema 952). Para a pessoa idosa, a lei proíbe cobrar valores diferenciados em razão da idade (Estatuto da Pessoa Idosa, art. 15, § 3º).
  - pergunta: Em caso urgente, a Justiça pode decidir rápido?
    resposta: É possível pedir uma decisão provisória logo no início do processo, quando a urgência está comprovada por relatório médico. A decisão depende da análise do juiz em cada caso.
chamadaTitulo: O plano negou o seu tratamento?
chamadaTexto: Envie a negativa e o pedido médico pelo WhatsApp. Eu mesmo leio e respondo.
avisoRodape: As informações desta página não substituem a análise individual de cada caso. Informações jurídicas conferidas em outubro de 2026.
