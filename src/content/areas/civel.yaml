faq:
  - pergunta: Vale tentar um acordo antes de entrar na Justiça?
    resposta: Muitas vezes, sim. A notificação formal também registra a tentativa de resolver sem processo.
  - pergunta: Vocês elaboram contratos?
    resposta: Sim, elaboração e revisão de contratos para pessoas e empresas.
  - pergunta: Existe prazo para entrar com a ação?
