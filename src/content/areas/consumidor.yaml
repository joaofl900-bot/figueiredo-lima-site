faq:
  - pergunta: Paguei uma cobrança indevida. Tenho direito à devolução?
    resposta: O consumidor cobrado em quantia indevida tem direito à devolução em dobro do que pagou a mais, com correção e juros, salvo engano justificável do fornecedor (CDC, art. 42, parágrafo único).
  - pergunta: Posso desistir de uma compra feita pela internet?
    resposta: Nas compras feitas fora da loja física, como pela internet ou por telefone, o consumidor pode desistir em até 7 dias da assinatura ou do recebimento, com devolução imediata do que pagou (CDC, art. 49).
  - pergunta: Fui vítima de golpe no banco. O que fazer primeiro?
    resposta: Avise o banco pelos canais oficiais, registre boletim de ocorrência e guarde comprovantes, prints e protocolos. A análise do caso indica se cabe pedir o ressarcimento.
chamadaTitulo: Teve um problema com uma empresa ou com o banco?
chamadaTexto: Conte o que aconteceu pelo WhatsApp. Eu mesmo leio e respondo.
avisoRodape: As informações desta página não substituem a análise individual de cada caso. Informações jurídicas conferidas em outubro de 2026.
