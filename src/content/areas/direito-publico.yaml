h1: Inabilitado na licitação ou diante de um edital com exigências irregulares?
abertura: Para empresas que contratam com o governo e para cidadãos diante de atos da Administração. Nas licitações, os prazos são de poucos dias úteis, e a análise do edital precisa vir cedo.
botao: Falar sobre a licitação ou o concurso
