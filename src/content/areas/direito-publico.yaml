faq:
  - pergunta: Qual é o prazo para impugnar um edital de licitação?
    resposta: Qualquer pessoa pode impugnar o edital até 3 dias úteis antes da abertura do certame (Lei nº 14.133/2021, art. 164).
  - pergunta: Qual é o prazo para recorrer na licitação?
    resposta: Em regra, 3 dias úteis contados da intimação ou da lavratura da ata, por exemplo contra o julgamento das propostas ou a inabilitação (Lei nº 14.133/2021, art. 165, I).
  - pergunta: Vocês atendem candidatos de concurso público?
    resposta: Sim. A análise começa pelo edital e pela decisão que se quer questionar.
chamadaTitulo: O prazo da licitação está correndo?
chamadaTexto: Envie o edital pelo WhatsApp.
avisoRodape: As informações desta página não substituem a análise individual de cada caso. Informações jurídicas conferidas em outubro de 2026.
